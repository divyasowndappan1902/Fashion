<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>Page Not Found - Stackly</title>
    <link href="styles.css" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com" rel="preconnect"/>
    <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0..1,0" rel="stylesheet" />
</head>
<body class="error-page" style="display: flex; flex-direction: column; min-height: 100vh; text-align: center; justify-content: center; align-items: center; background-color: #f7f4ec;">
    <div class="logo" style="position: absolute; top: 2rem; left: 50%; transform: translateX(-50%);">
        <a href="index.html"><img src="assets/logo_0174.webp" alt="STACKLY Logo" style="height: 30px;" /></a>
    </div>
    
    <div style="max-width: 600px; padding: 2rem;">
        <span class="sub-heading" style="font-size: 0.75rem; letter-spacing: 0.15em; color: var(--text-gray); text-transform: uppercase; margin-bottom: 1rem; display: block;">404 ERROR</span>
        <h1 class="serif-heading" style="font-size: 4rem; color: var(--text-dark); margin-bottom: 2rem; font-weight: 400;">Page not found</h1>
        <p style="color: var(--text-gray); line-height: 1.6; margin-bottom: 3rem;">The page you are looking for might have been removed, had its name changed, or is temporarily unavailable.</p>
        <div style="display: flex; gap: 1rem; justify-content: center; flex-wrap: wrap;">
            <a href="#" onclick="history.back(); return false;" class="btn" style="background-color: transparent; color: var(--text-dark); border: 1px solid var(--text-dark); padding: 1rem 2.5rem; text-decoration: none; font-size: 0.75rem; letter-spacing: 0.1em; text-transform: uppercase; transition: all 0.3s ease;">GO BACK</a>
            <a href="index.html" class="btn" style="background-color: var(--text-dark); color: white; border: 1px solid var(--text-dark); padding: 1rem 2.5rem; text-decoration: none; font-size: 0.75rem; letter-spacing: 0.1em; text-transform: uppercase; transition: all 0.3s ease;">RETURN TO HOMEPAGE</a>
        </div>
    </div>

<script src="scripts.js"></script>

<script>
    document.addEventListener('DOMContentLoaded', function() {
        const toggle = document.querySelector('.mobile-menu-toggle');
        const nav = document.querySelector('.nav-links');
        if(toggle && nav) {
            toggle.addEventListener('click', function() {
                nav.classList.toggle('active');
                document.body.classList.toggle('no-scroll');
                const icon = toggle.querySelector('span');
                if (nav.classList.contains('active')) {
                    icon.textContent = 'close';
                } else {
                    icon.textContent = 'menu';
                }
            });
        }
    });
</script>
</body>
</html>
